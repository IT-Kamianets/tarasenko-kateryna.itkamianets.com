<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1eb">
  <meta name="robots" content="noindex, follow">
  <title>Сторінку не знайдено — Катерина Тарасенко</title>
  <style>
    :root { --ink: #19271f; --muted: #647168; --paper: #f4f1eb; --green: #355c45; --lime: #d9e6a5; --line: #dce1d7; --serif: Georgia, "Times New Roman", serif; --sans: Inter, "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .page { width: min(100% - 48px, 1000px); padding: 30px 0; }
    .topline { display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
    .brand::before { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px #dfe8d4; content: ""; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; padding: clamp(55px, 12vh, 120px) 0; }
    .code { margin: 0; color: var(--green); font: 500 clamp(100px, 20vw, 190px)/.82 var(--serif); letter-spacing: -.09em; }
    .eyebrow { margin: 0 0 15px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; font: 500 clamp(36px, 5vw, 56px)/1.05 var(--serif); letter-spacing: -.04em; }
    .description { max-width: 390px; margin: 16px 0 26px; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .home { display: inline-flex; align-items: center; gap: 12px; padding: 12px 17px; background: var(--green); color: white; font-size: 13px; font-weight: 700; text-decoration: none; transition: background .2s, transform .2s; }
    .home::after { content: "↗"; font-size: 16px; }
    .home:hover { transform: translateY(-2px); background: #284834; }
    .home:focus-visible, .brand:focus-visible { outline: 3px solid #96ae74; outline-offset: 4px; }
    footer { padding-top: 17px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    @media (max-width: 600px) { .page { width: min(100% - 34px, 430px); } main { grid-template-columns: 1fr; gap: 28px; padding: 70px 0; } .code { font-size: clamp(110px, 38vw, 170px); } .topline { font-size: 9px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="topline"><a class="brand" href="/">Катерина Тарасенко</a><span>Копірайтерка · Редакторка</span></header>
    <main>
      <p class="code" aria-label="Помилка 404">404</p>
      <div>
        <p class="eyebrow">Схоже, тут порожня сторінка</p>
        <h1>Не знайшли потрібні слова.</h1>
        <p class="description">Можливо, адресу введено з помилкою або сторінку переміщено. Поверніться на головну — там усе на місці.</p>
        <a class="home" href="/">На головну</a>
      </div>
    </main>
    <footer>© Катерина Тарасенко</footer>
  </div>
</body>
</html>
